<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  body {
    width: 1200px;
    height: 630px;
    background: #0f172a;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Background glow blobs */
  .blob1 {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(249,115,22,0.18) 0%, transparent 70%);
    top: -200px;
    right: -100px;
  }
  .blob2 {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(249,115,22,0.08) 0%, transparent 70%);
    bottom: -100px;
    left: 100px;
  }

  /* Grid dots pattern */
  .grid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  .content {
    position: relative;
    z-index: 10;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 96px;
  }

  /* Logo row */
  .logo-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 40px;
  }
  .logo-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, #f97316, #ea580c);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
    color: white;
    letter-spacing: -0.02em;
    flex-shrink: 0;
  }
  .logo-text {
    font-size: 26px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.03em;
  }

  /* Headline */
  h1 {
    font-size: 62px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 20px;
  }
  h1 span {
    background: linear-gradient(90deg, #f97316, #fb923c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Subtitle */
  .subtitle {
    font-size: 22px;
    color: rgba(255,255,255,0.55);
    font-weight: 400;
    line-height: 1.5;
    max-width: 680px;
    margin-bottom: 40px;
  }

  /* Pill badges */
  .badges {
    display: flex;
    gap: 10px;
  }
  .badge {
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .badge-orange {
    background: rgba(249,115,22,0.2);
    color: #fb923c;
    border: 1px solid rgba(249,115,22,0.3);
  }
  .badge-white {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.12);
  }

  /* Right side card */
  .card {
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
    width: 260px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 24px;
    z-index: 10;
  }
  .card-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.35);
    margin-bottom: 16px;
  }
  .stat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-label {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    font-weight: 500;
  }
  .stat-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .pill-green {
    background: rgba(16,185,129,0.15);
    color: #34d399;
  }
  .pill-orange {
    background: rgba(249,115,22,0.15);
    color: #fb923c;
  }
  .pill-blue {
    background: rgba(59,130,246,0.15);
    color: #60a5fa;
  }
</style>
</head>
<body>
  <div class="blob1"></div>
  <div class="blob2"></div>
  <div class="grid"></div>

  <div class="content">
    <div class="logo-row">
      <div class="logo-icon">u</div>
      <div class="logo-text">uTerms</div>
    </div>

    <h1>Privacy Compliance,<br><span>Made Simple</span></h1>

    <p class="subtitle">Cookie consent, privacy policies &amp; GDPR compliance — automated for your website.</p>

    <div class="badges">
      <div class="badge badge-orange">GDPR Ready</div>
      <div class="badge badge-white">CCPA Compliant</div>
      <div class="badge badge-white">Cookie Consent</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Compliance Status</div>
    <div class="stat-row">
      <span class="stat-label">Cookie Banner</span>
      <span class="stat-pill pill-green">Active</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Privacy Policy</span>
      <span class="stat-pill pill-green">Published</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">GCM v2</span>
      <span class="stat-pill pill-orange">Configured</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Consent Logs</span>
      <span class="stat-pill pill-blue">Recording</span>
    </div>
  </div>
</body>
</html>
