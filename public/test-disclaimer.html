<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disclaimer Test</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 { color: #333; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Disclaimer Embed Test</h1>
      <p>Loading Disclaimer... (This should display the generated document below)</p>

      <div
        id="uterms-disclaimer"
        style="border:1px solid #ddd;padding:20px;margin-top:20px;background-color:#f9f9f9;"
      >
        <p>Loading Disclaimer...</p>
      </div>

      <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get("id") || "";
        const apiUrl = urlParams.get("api") || "http://localhost:3001";

        const container = document.getElementById("uterms-disclaimer");
        container.innerHTML = `<p>Loading Disclaimer for user: <code>${userId}</code>...</p>`;

        fetch(`${apiUrl}/api/embed/disclaimer/${encodeURIComponent(userId)}`)
          .then((r) => r.json())
          .then((data) => {
            if (data.error) {
              container.innerHTML = `
                <div style="color:#d32f2f;background-color:#ffebee;padding:15px;border-radius:4px;border:1px solid #f44336;">
                  <strong>Error:</strong> ${data.error}
                  <p style="margin:10px 0 0 0;font-size:0.9em;">
                    This user ID does not have a published Disclaimer yet.
                    Please <a href="/disclaimer">go to Disclaimer</a> and publish one first.
                  </p>
                </div>`;
            } else {
              const script = document.createElement("script");
              script.src = `/uterms-disclaimer-embed.js?id=${encodeURIComponent(userId)}`;
              script.onerror = () => {
                container.innerHTML = `
                  <div style="color:#d32f2f;background-color:#ffebee;padding:15px;border-radius:4px;border:1px solid #f44336;">
                    <strong>Error:</strong> Failed to load Disclaimer script
                    <p style="margin:10px 0 0 0;font-size:0.9em;">
                      Please check that the backend server is running on ${apiUrl}
                    </p>
                  </div>`;
              };
              document.body.appendChild(script);
            }
          })
          .catch((err) => {
            container.innerHTML = `
              <div style="color:#d32f2f;background-color:#ffebee;padding:15px;border-radius:4px;border:1px solid #f44336;">
                <strong>Error:</strong> Cannot connect to backend
                <p style="margin:10px 0 0 0;font-size:0.9em;">
                  ${err.message}<br>
                  Make sure the backend server is running: <code>node server/index.js</code>
                </p>
              </div>`;
          });
      </script>
    </div>
  </body>
</html>
