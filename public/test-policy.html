<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy Policy Test</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Privacy Policy Embed Test</h1>
      <p>
        Loading privacy policy... (This should display the generated privacy
        policy below)
      </p>

      <!-- Step 1: place this where you want the policy to appear -->
      <div
        id="uterms-policy"
        style="
          border: 1px solid #ddd;
          padding: 20px;
          margin-top: 20px;
          background-color: #f9f9f9;
        "
      >
        <p>Loading policy...</p>
      </div>

      <!-- Step 2: Dynamic script loading based on query parameter -->
      <script>
        // Get the user ID from query string
        const urlParams = new URLSearchParams(window.location.search);
        const userId =
          urlParams.get("id") || "c813ce9f-1e3c-418e-bd45-97c125152ebe";

        // Display the ID being used
        const policyContainer = document.getElementById("uterms-policy");
        policyContainer.innerHTML = `<p>Loading policy for user: <code>${userId}</code>...</p>`;

        // First, check if the policy exists via the API
        fetch(`http://localhost:3001/api/embed/policy/${encodeURIComponent(userId)}`)
          .then((r) => r.json())
          .then((data) => {
            if (data.error) {
              policyContainer.innerHTML = `
                <div style="color: #d32f2f; background-color: #ffebee; padding: 15px; border-radius: 4px; border: 1px solid #f44336;">
                  <strong>Error:</strong> ${data.error}
                  <p style="margin: 10px 0 0 0; font-size: 0.9em;">
                    This user ID does not have a published privacy policy yet. 
                    Please <a href="/dashboard">go to the Dashboard</a> and create a privacy policy first.
                  </p>
                </div>
              `;
            } else {
              // Policy exists, load the embed script
              const script = document.createElement("script");
              script.src = `http://localhost:3001/uterms-policy-embed.js?id=${encodeURIComponent(userId)}`;
              script.onerror = () => {
                policyContainer.innerHTML = `
                  <div style="color: #d32f2f; background-color: #ffebee; padding: 15px; border-radius: 4px; border: 1px solid #f44336;">
                    <strong>Error:</strong> Failed to load privacy policy script
                    <p style="margin: 10px 0 0 0; font-size: 0.9em;">
                      Please check that the backend server is running on http://localhost:3001
                    </p>
                  </div>
                `;
              };
              document.body.appendChild(script);
            }
          })
          .catch((err) => {
            policyContainer.innerHTML = `
              <div style="color: #d32f2f; background-color: #ffebee; padding: 15px; border-radius: 4px; border: 1px solid #f44336;">
                <strong>Error:</strong> Cannot connect to backend
                <p style="margin: 10px 0 0 0; font-size: 0.9em;">
                  ${err.message}
                  <br>Make sure the backend server is running: <code>node server/index.js</code>
                </p>
              </div>
            `;
          });
      </script>
    </div>
  </body>
</html>
