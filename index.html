<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font preconnect + load via <link> (faster than CSS @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />

    <!-- Primary SEO -->
    <title>uTerms — Cookie Consent & Privacy Policy Platform</title>
    <meta name="description" content="Automate cookie consent, generate GDPR-compliant privacy policies, and manage visitor consent globally. The all-in-one privacy compliance platform for your website." />
    <meta name="keywords" content="cookie consent, privacy policy generator, GDPR compliance, CCPA, cookie banner, consent management platform" />
    <link rel="canonical" href="https://uterms.io/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://uterms.io/" />
    <meta property="og:title" content="uTerms — Cookie Consent & Privacy Policy Platform" />
    <meta property="og:description" content="Automate cookie consent, generate GDPR-compliant privacy policies, and manage visitor consent globally." />
    <meta property="og:image" content="https://uterms.io/og-image.png" />
    <meta property="og:site_name" content="uTerms" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="uTerms — Cookie Consent & Privacy Policy Platform" />
    <meta name="twitter:description" content="Automate cookie consent, generate GDPR-compliant privacy policies, and manage visitor consent globally." />
    <meta name="twitter:image" content="https://uterms.io/og-image.png" />

    <!-- Misc -->
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f97316" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "uTerms",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "url": "https://uterms.io",
      "description": "All-in-one AI privacy compliance platform: cookie consent banner, GDPR/CCPA policy generator, and visitor consent management.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "publisher": {
        "@type": "Organization",
        "name": "uTerms",
        "url": "https://uterms.io",
        "email": "privacy@uterms.io"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
